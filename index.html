<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cyber Empire: Idle Clicker</title>
<style>
  * { box-sizing: border-box; touch-action: manipulation; }
  body { background: #0b1120; color: #fff; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 12px; user-select: none; -webkit-tap-highlight-color: transparent; }
  .card { background: #1e293b; border: 2px solid #38bdf8; border-radius: 18px; padding: 20px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
  .rank { background: #0f172a; padding: 10px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #334155; }
  .rank-name { color: #38bdf8; font-weight: bold; font-size: 15px; }
  .bar-bg { background: #1e293b; height: 8px; border-radius: 4px; margin-top: 8px; overflow: hidden; }
  .bar-fill { background: #38bdf8; height: 100%; width: 0%; transition: 0.2s; }
  .bal { font-size: 40px; font-weight: bold; color: #fbbf24; margin: 8px 0 4px 0; }
  .stat { color: #94a3b8; font-size: 14px; margin-bottom: 18px; }
  .main-btn { background: #0284c7; border: 4px solid #7dd3fc; color: #fff; width: 145px; height: 145px; border-radius: 50%; font-size: 22px; font-weight: bold; cursor: pointer; box-shadow: 0 7px 0 #0369a1; margin-bottom: 20px; }
  .main-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #0369a1; }
  .shop-btn { width: 100%; background: #0f172a; color: #fff; border: 1px solid #334155; padding: 14px 12px; margin-bottom: 10px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 14px; }
  .shop-btn:active { border-color: #38bdf8; background: #162238; }
  .price { background: #fbbf24; color: #000; font-weight: bold; padding: 6px 12px; border-radius: 8px; font-size: 14px; }
  .footer { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #64748b; }
  .reset { background: none; border: 1px solid #475569; color: #94a3b8; padding: 4px 10px; border-radius: 6px; font-size: 11px; }
</style>
</head>
<body>

<div class="card">
  <div class="rank">
    <div class="rank-name" id="rName">Level 1: Rookie</div>
    <div class="bar-bg"><div class="bar-fill" id="rBar"></div></div>
  </div>

  <div class="bal">$<span id="m">0</span></div>
  <div class="stat">Click: +$<span id="c">1</span> | Auto: +$<span id="s">0</span>/sec</div>

  <button class="main-btn" onclick="m += c; tot += c; show();">MINE</button>

  <button class="shop-btn" onclick="if(m >= p1){ m -= p1; c += 1; p1 = Math.round(p1*1.45); show(); save(); }">
    <span>Gaming Mouse (+1/click)</span>
    <span class="price">$<span id="p1">15</span></span>
  </button>

  <button class="shop-btn" onclick="if(m >= p2){ m -= p2; s += 2; p2 = Math.round(p2*1.45); show(); save(); }">
    <span>Auto-Bot (+2/sec)</span>
    <span class="price">$<span id="p2">50</span></span>
  </button>

  <button class="shop-btn" onclick="if(m >= p3){ m -= p3; s += 15; p3 = Math.round(p3*1.45); show(); save(); }">
    <span>Mining Farm (+15/sec)</span>
    <span class="price">$<span id="p3">250</span></span>
  </button>

  <button class="shop-btn" onclick="if(m >= p4){ m -= p4; c += 10; s += 60; p4 = Math.round(p4*1.45); show(); save(); }">
    <span>Corporation (+10 / +60/sec)</span>
    <span class="price">$<span id="p4">1000</span></span>
  </button>

  <div class="footer">
    <span id="sav">Auto-save on</span>
    <button class="reset" onclick="if(confirm('Reset all progress?')){ localStorage.removeItem('mobClickEn'); location.reload(); }">Reset</button>
  </div>
</div>

<script>
  var m = 0, tot = 0, c = 1, s = 0;
  var p1 = 15, p2 = 50, p3 = 250, p4 = 1000;

  function load() {
    var d = localStorage.getItem("mobClickEn");
    if (d) {
      var x = JSON.parse(d);
      m = x.m || 0; tot = x.tot || 0; c = x.c || 1; s = x.s || 0;
      p1 = x.p1 || 15; p2 = x.p2 || 50; p3 = x.p3 || 250; p4 = x.p4 || 1000;
    }
  }

  function save() {
    localStorage.setItem("mobClickEn", JSON.stringify({ m:m, tot:tot, c:c, s:s, p1:p1, p2:p2, p3:p3, p4:p4 }));
    document.getElementById("sav").innerText = "Saved!";
    setTimeout(function() { document.getElementById("sav").innerText = "Auto-save on"; }, 1000);
  }

  function show() {
    document.getElementById("m").innerText = Math.floor(m);
    document.getElementById("c").innerText = c;
    document.getElementById("s").innerText = s;
    document.getElementById("p1").innerText = p1;
    document.getElementById("p2").innerText = p2;
    document.getElementById("p3").innerText = p3;
    document.getElementById("p4").innerText = p4;

    var name = "Level 1: Rookie", goal = 100;
    if (tot >= 10000) { name = "Level 4: Cyber Tycoon"; goal = 100000; }
    else if (tot >= 1500) { name = "Level 3: Businessman"; goal = 10000; }
    else if (tot >= 100) { name = "Level 2: Pro Miner"; goal = 1500; }

    document.getElementById("rName").innerText = name;
    var pct = Math.min(100, (tot / goal) * 100);
    document.getElementById("rBar").style.width = pct + "%";
  }

  load();
  show();

  setInterval(function() {
    if (s > 0) { m += s / 10; tot += s / 10; show(); }
  }, 100);

  setInterval(save, 3000);
</script>

</body>
</html>
